name: Build, push and deploy to Azure

on:
  push:
    branches: [ main ]

permissions:
  id-token: write   # lets the job request a GitHub OIDC token
  contents: read    # lets the job read the repository

env:
  IMAGE_NAME: codealpha-java-app
  ACR_LOGIN_SERVER: codealphaacr1234.azurecr.io
  WEBAPP_NAME: codealpha-java-app-2026
  RESOURCE_GROUP: codealpha-devops-rg

jobs:
  build-test-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and test with Gradle
        run: ./gradlew build

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name codealphaacr1234

      - name: Build Docker image
        run: docker build -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} .

      - name: Push image to ACR
        run: docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}

      - name: Deploy image to Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
